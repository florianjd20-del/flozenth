<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>FLOZENTH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="app-style">
/* Layout: Slicer-Optik. Sticky Leiste, Hero mit live "gedrucktem" Teil auf der Druckplatte, Materialband, Artikelraster, Ablauf in drei Schritten. */
:root{
  --bg:#0C0E11; --surface:#14181D; --surface2:#1C222A; --fg:#ECEFF3; --muted:#8F9AA8;
  --line:#272E38; --accent:#6C86FF; --accent-fg:#0A0F28; --hot:#FFD23F; --hot-fg:#1A1400;
  --danger:#FF9D97; --ok:#7BE0A0; --glass:rgba(12,14,17,.78);
  --font-display:"Unbounded",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#E2E7EE; --fg:#10141A; --muted:#566170;
    --line:#CFD6DF; --accent:#2B47E6; --accent-fg:#FFFFFF; --danger:#B3261E; --ok:#17693A; --glass:rgba(237,240,244,.82);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#E2E7EE; --fg:#10141A; --muted:#566170;
  --line:#CFD6DF; --accent:#2B47E6; --accent-fg:#FFFFFF; --danger:#B3261E; --ok:#17693A; --glass:rgba(237,240,244,.82);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:15}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.owner{background:var(--surface2);border-bottom:1px solid var(--line);padding-block:10px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.owner .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.owner span{color:var(--muted);font-size:13px;flex:1;min-width:200px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
.logo i{width:18px;height:18px;border-radius:4px;flex:none;background:repeating-linear-gradient(0deg,var(--accent) 0 3px,transparent 3px 5px)}
.count{background:var(--hot);color:var(--hot-fg);border-radius:999px;padding:0 8px;font-family:var(--font-mono);font-size:12px;font-weight:500}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;padding-block:44px 36px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.hero h1{font-size:clamp(2.3rem,7vw,4.6rem);font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.hero p{color:var(--muted);font-size:17px;max-width:46ch;margin:18px 0 0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.bed{background:linear-gradient(180deg,var(--surface),var(--bg));border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;min-width:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-color:var(--surface)}
.bed canvas{width:100%;height:auto;aspect-ratio:480/420;display:block}
.bedinfo{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.prog{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}

.strip{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;padding-block:14px;border-block:1px solid var(--line);font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.strip b{color:var(--fg);font-weight:500}
.sec{padding-block:44px 8px}
.sec h2{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;letter-spacing:-.02em}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:18px 6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding-block:14px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pic{aspect-ratio:1/1;background:var(--surface2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.28) 3px 4px)}
.ph{width:46%;height:78%;clip-path:polygon(30% 0,70% 0,78% 30%,100% 100%,0 100%,22% 30%)}
.tag{position:absolute;left:10px;top:10px;z-index:1;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-family:var(--font-mono);font-size:11px}
.info{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.info h3{font-size:1rem;font-weight:600;letter-spacing:-.01em}
.info p{margin:0;color:var(--muted);font-size:14px}
.specs{display:flex;gap:6px;flex-wrap:wrap}
.specs span{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.buy{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
.price{font-family:var(--font-mono);font-weight:500;font-size:15px;background:var(--hot);color:var(--hot-fg);border-radius:8px;padding:5px 10px;font-variant-numeric:tabular-nums}
.empty{padding:40px 0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding-block:18px 40px}
.step{border-top:2px solid var(--accent);padding-top:14px}
.step .n{font-family:var(--font-mono);color:var(--accent);font-size:13px}
.step h3{font-size:1.05rem;margin:6px 0}
.step p{margin:0;color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);padding-block:20px 44px;color:var(--muted);font-size:13px;white-space:pre-line}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;justify-content:flex-end}
.panel{background:var(--bg);border-left:1px solid var(--line);width:min(520px,100%);height:100%;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) 16px;
  display:flex;flex-direction:column;gap:16px}
.panel.wide{width:min(760px,100%)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phead h2,.phead h3{font-weight:800}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.qty{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.total{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:1.15rem;font-weight:500}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=email],input[type=number],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;color:var(--fg)}
textarea{min-height:90px;resize:vertical}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:13px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.arow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.arow .nm{flex:1;min-width:140px;font-weight:500}
.thumb{width:44px;height:44px;border-radius:6px;background:var(--surface2);object-fit:cover}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
.status.ok{color:var(--ok)}
.out{font-family:var(--font-mono);font-size:12px;min-height:160px}

.hero{position:relative}
.hero::before{content:"";position:absolute;inset:-30px 0 auto 0;height:460px;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 300px at 80% 45%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%),
             radial-gradient(380px 220px at 8% 8%,color-mix(in srgb,var(--hot) 12%,transparent),transparent 70%)}
.hero h1 .g{background:linear-gradient(100deg,var(--fg) 25%,var(--accent) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn.primary:hover{box-shadow:0 6px 28px color-mix(in srgb,var(--accent) 50%,transparent)}
.stats{display:flex;gap:30px;margin-top:32px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--font-display);font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.stats span{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.marq{overflow:hidden;border-block:1px solid var(--line);padding-block:13px;white-space:nowrap}
.marq .tr{display:inline-flex;width:max-content}
.marq .grp{display:inline-flex;gap:34px;padding-right:34px;font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.marq .grp b{color:var(--fg);font-weight:500}
.marq .grp i{font-style:normal;color:var(--accent)}
.sec h2::after{content:"";display:block;width:64px;height:8px;margin-top:12px;background:repeating-linear-gradient(0deg,var(--accent) 0 2px,transparent 2px 4px)}
.card{position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;z-index:2;transition:opacity .25s;
  background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 24%,transparent),transparent 65%)}
.card:hover::before{opacity:1}
.step{transition:border-color .2s}
.step:hover{border-top-color:var(--hot)}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:no-preference){.marq .tr{animation:mq 30s linear infinite}}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-block:28px 24px;gap:22px}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .card{transition:border-color .2s,transform .2s}
  .card:hover{border-color:var(--accent);transform:translateY(-3px)}
  .card:hover .pic::after{opacity:1}
  .pic::after{transition:opacity .3s}
}
</style>

<script id="app-js">
(function(){
  var DATA = JSON.parse(document.getElementById('shop-data').textContent);
  var state = DATA;
  var cart = {};
  var filter = 'Alle';
  var canEdit = false, artifactCap = null, downloadsCap = null;
  var dlStatus = {text:'', cls:''};
  var dirty = false;
  var editing = null;
  var pubStatus = {text:'', cls:''};
  var orderText = '', orderErr = '', orderSent = false, sending = false;
  var app = document.getElementById('app');
  var overlay = null;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
  var fmt = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
  function eur(n){return fmt.format(Number(n)||0);}
  function byId(id){return state.products.find(function(p){return p.id===id});}
  function hue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h;}
  function cartCount(){return Object.keys(cart).reduce(function(a,k){return a+cart[k]},0);}
  function cartTotal(){return Object.keys(cart).reduce(function(a,k){var p=byId(k);return a+(p?p.price*cart[k]:0)},0);}
  function cats(){var s=[];state.products.forEach(function(p){if(p.cat&&s.indexOf(p.cat)<0)s.push(p.cat)});return s;}
  function mats(){var s=[];state.products.forEach(function(p){if(p.material&&s.indexOf(p.material)<0)s.push(p.material)});return s;}

  function pic(p){
    if(p.img) return '<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'">';
    var h=hue(p.id);
    return '<div class="ph" style="background:repeating-linear-gradient(0deg,hsl('+h+' 55% 56%) 0 3px,hsl('+h+' 55% 44%) 3px 6px)"></div>';
  }

  function card(p){
    var specs=[p.material,p.size].filter(Boolean).map(function(s){return '<span>'+esc(s)+'</span>'}).join('');
    return '<article class="card"><div class="pic">'+pic(p)+(p.available?'':'<span class="tag">Ausverkauft</span>')+'</div>'+
      '<div class="info"><h3>'+esc(p.name)+'</h3>'+(specs?'<div class="specs">'+specs+'</div>':'')+
      (p.desc?'<p>'+esc(p.desc)+'</p>':'')+
      '<div class="buy"><span class="price">'+eur(p.price)+'</span>'+
      '<button class="btn primary" data-act="add" data-id="'+esc(p.id)+'"'+(p.available?'':' disabled')+'>In den Korb</button></div></div></article>';
  }

  function marquee(m){
    var words=['Auf Bestellung gedruckt','Schicht für Schicht','Einzelstücke'].concat(m);
    var grp='<span class="grp">'+words.map(function(w,i){return (i<3?'<span>':'<b>')+esc(w)+(i<3?'</span>':'</b>')+'<i>/</i>'}).join('')+'</span>';
    return '<div class="marq" aria-hidden="true"><div class="tr">'+grp+grp+'</div></div>';
  }

  function render(){
    var list=state.products.filter(function(p){return filter==='Alle'||p.cat===filter});
    var chips=['Alle'].concat(cats()).map(function(c){return '<button class="chip" data-act="filter" data-v="'+esc(c)+'" aria-pressed="'+(c===filter)+'">'+esc(c)+'</button>'}).join('');
    var hasDemo=state.products.some(function(p){return p.demo});
    var owner='';
    if(canEdit){
      owner='<div class="owner"><div class="wrap"><span>'+(hasDemo?'Das sind Beispielartikel. Ersetze sie in der Verwaltung durch deine eigenen. ':'Du bist als Besitzer angemeldet. ')+(dirty?'Es gibt Änderungen, die noch nicht veröffentlicht sind.':'')+'</span>'+
        '<button class="btn small" data-act="open-admin">Verwaltung</button>'+
        '<button class="btn small primary" data-act="publish"'+(dirty?'':' disabled')+'>Veröffentlichen</button>'+
        (downloadsCap?'<button class="btn small" data-act="download">Datei für Netlify</button>':'')+
        '<span class="status '+pubStatus.cls+'" role="status" style="flex:none;min-width:0">'+esc(pubStatus.text)+'</span></div></div>';
    }
    var m=mats();
    app.innerHTML=owner+
      '<div class="nav"><div class="wrap"><div class="logo"><i></i><span>'+esc(state.shop.name)+'</span></div>'+
      '<button class="btn small" data-act="open-cart">Warenkorb <span class="count">'+cartCount()+'</span></button></div></div>'+
      '<div class="wrap">'+
      '<section class="hero"><div class="hcopy"><div class="eyebrow">FDM-3D-Druck · auf Bestellung</div><h1><span class="g">'+esc(state.shop.name)+'</span></h1><p>'+esc(state.shop.tagline)+'</p>'+
      '<div class="cta"><button class="btn primary" data-act="scroll">Artikel ansehen</button><button class="btn" data-act="open-cart">Anfrage stellen</button></div>'+
      '<div class="stats"><div><b>'+state.products.length+'</b><span>Artikel</span></div><div><b>'+cats().length+'</b><span>Kategorien</span></div><div><b>'+mats().length+'</b><span>Materialien</span></div></div></div>'+
      '<div class="bed"><canvas id="hero-cv" width="480" height="420" role="img" aria-label="Die Artikel des Shops werden Schicht für Schicht gedruckt"></canvas>'+
      '<div class="bedinfo"><span id="hero-layer">Schicht 270 / 300</span><div class="prog"><i id="hero-bar"></i></div><span id="hero-fil" style="color:var(--fg);max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div></div></section>'+
      marquee(m)+
      '<section class="sec" id="artikel"><h2>Artikel</h2><div class="filters" role="group" aria-label="Kategorien">'+chips+'</div>'+
      (list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<p class="empty">In dieser Kategorie gibt es noch keine Artikel.</p>')+'</section>'+
      '<section class="sec"><h2>So läuft deine Bestellung</h2><div class="steps">'+
      '<div class="step"><div class="n">01</div><h3>Artikel wählen</h3><p>Lege alles in den Warenkorb, was dir gefällt. Wunschfarbe schreibst du später dazu.</p></div>'+
      '<div class="step"><div class="n">02</div><h3>Anfrage senden</h3><p>Du schickst deine Wunschliste direkt über die Seite an uns ab.</p></div>'+
      '<div class="step"><div class="n">03</div><h3>Wir drucken</h3><p>Nach deiner Bestätigung wird dein Artikel gedruckt und zu dir geschickt.</p></div></div></section>'+
      '<footer>'+esc(state.shop.legal)+'</footer></div>'+
      '<div id="ov"></div>';
    renderOverlay();
    if(reduced) heroDraw(1,0,heroProducts()[0]);
  }

  function renderOverlay(){
    var ov=document.getElementById('ov'); if(!ov) return;
    if(overlay==='cart') ov.innerHTML=cartHtml();
    else if(overlay==='admin') ov.innerHTML=adminHtml();
    else ov.innerHTML='';
  }

  function cartHtml(){
    if(orderSent) return '<div class="overlay" data-act="close-bg"><div class="panel" role="dialog" aria-label="Anfrage gesendet"><div class="phead"><h2>Danke!</h2><button class="btn small" data-act="close">Schließen</button></div>'+

  var reduced=false;

  function prof(p){var h=0,s=String(p.id);for(var i=0;i<s.length;i++)h=(h*17+s.charCodeAt(i))%97;return h%4;}
  function rad(t,pf){
    if(pf===0) return 62+30*Math.sin(t*6.2+0.4)+16*t;
    if(pf===1) return 58+8*t+4*Math.sin(t*20);
    if(pf===2) return 12+78*(1-t);
    return 44+30*Math.cos(t*6.2832);
  }
  function getImg(p){
    if(!p.img) return null;

    if(!c||c.src!==p.img){c=imgs[p.id]={src:p.img,im:new Image()};c.im.src=p.img;}

  function nozzle(ctx,nx,ny,done,glow){
    if(!done&&glow){
      var gl=ctx.createRadialGradient(nx,ny,0,nx,ny,18);
      gl.addColorStop(0,'rgba(255,210,63,.95)'); gl.addColorStop(1,'rgba(255,210,63,0)');
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(nx,ny,18,0,6.2832); ctx.fill();
    }
    ctx.fillStyle='#6B7686'; ctx.fillRect(nx-15,ny-46,30,20);
    ctx.fillStyle='#A5AFBD'; ctx.beginPath(); ctx.moveTo(nx-9,ny-26); ctx.lineTo(nx+9,ny-26); ctx.lineTo(nx+2.5,ny-3); ctx.lineTo(nx-2.5,ny-3); ctx.closePath(); ctx.fill();
  }
  function heroDraw(p,ts,prod){
    var cv=document.getElementById('hero-cv'); if(!cv||!prod) return;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    if(cv.getAttribute('data-r')!==String(dpr)){cv.width=Math.round(480*dpr);cv.height=Math.round(420*dpr);cv.setAttribute('data-r',String(dpr));}
    if(tmp.width!==cv.width){tmp.width=cv.width;tmp.height=cv.height;}
    if(colTick++%90===0) readCols();
    var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,480,420);
    ctx.fillStyle=cols.bed; ctx.strokeStyle=cols.line; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(CX,BASE+8,176,48,0,0,6.2832); ctx.fill(); ctx.stroke();
    var done=p>=1, k, total, im=getImg(prod);
    if(im){
      var FW=280, FH=280, FX=CX-FW/2, FY=BASE-FH-6;
      var rh=Math.max(2,Math.floor(p*FH)); k=rh; total=FH;
      ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle=cols.line; ctx.lineWidth=1.5; ctx.strokeRect(FX,FY,FW,FH); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.rect(FX,FY+FH-rh,FW,rh); ctx.clip();
      var s=Math.max(FW/im.naturalWidth,FH/im.naturalHeight), dw=im.naturalWidth*s, dh=im.naturalHeight*s;
      ctx.drawImage(im,CX-dw/2,FY+FH/2-dh/2,dw,dh);
      ctx.fillStyle='rgba(0,0,0,.22)';
      for(var y=FY+FH-rh;y<FY+FH;y+=4) ctx.fillRect(FX,y,FW,1);
      ctx.restore();
      var ly=FY+FH-rh, nx=FX+FW*(0.5+0.5*Math.sin(ts/260));
      if(!done){ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fillRect(FX,ly-1,FW,2);}
      nozzle(ctx,nx,ly-(done?46:0),done,true);
    } else {
      var pf=prof(prod), N=NS[pf], hb=hue(String(prod.id));
      k=Math.max(1,Math.min(N,Math.floor(p*N))); total=N;
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(CX,BASE+8,96,26,0,0,6.2832); ctx.fill();
      var t2=tmp.getContext('2d'); t2.setTransform(dpr,0,0,dpr,0,0); t2.clearRect(0,0,480,420);
      for(var i=0;i<k;i++){
        var t=i/N, r=rad(t,pf);

        t2.beginPath(); t2.ellipse(CX,BASE-i,r,r*0.26,0,0,6.2832); t2.fill();
      }
      t2.globalCompositeOperation='source-atop';

      g.addColorStop(0,'rgba(0,0,0,.62)'); g.addColorStop(.32,'rgba(255,255,255,.06)');
      g.addColorStop(.55,'rgba(255,255,255,.2)'); g.addColorStop(1,'rgba(0,0,0,.66)');
      t2.fillStyle=g; t2.fillRect(0,0,480,420);
      t2.globalCompositeOperation='source-over';
      ctx.drawImage(tmp,0,0,480,420);
      var ty=BASE-k, tr=rad(k/N,pf), a=ts/240;
      var nx2=CX+tr*Math.cos(a), ny=ty+tr*0.26*Math.sin(a)-(done?46:0);
      if(!done){
        ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(CX,ty,tr,tr*0.26,0,0,6.2832); ctx.stroke();
      }
      nozzle(ctx,nx2,ny,done,true);
    }
    var lb=document.getElementById('hero-layer'), br=document.getElementById('hero-bar'), fl=document.getElementById('hero-fil');
    if(lb) lb.textContent='Schicht '+k+' / '+total;
    if(br) br.style.width=(k/total*100)+'%';
    if(fl) fl.textContent=prod.name+(prod.price>0?' · '+eur(prod.price):'');
  }
  var t0=null;
  function loop(ts){
    if(t0===null) t0=ts-0.9*PRINT_MS;
    var list=heroProducts();
    var idx=Math.floor((ts-t0)/CYCLE_MS)%list.length;
    var e=(ts-t0)%CYCLE_MS;
    heroDraw(Math.min(1,e/PRINT_MS),ts,list[idx]);
    requestAnimationFrame(loop);
  }

  render();
  if(!reduced) requestAnimationFrame(loop);
  try{
    if(window.claude&&window.claude.use){
      window.claude.use('user').then(function(u){return u?u.canEdit():false}).then(function(ce){
        if(!ce) return;
        return window.claude.use('artifact').then(function(a){ if(a){artifactCap=a;canEdit=true;render();} }).then(function(){return window.claude.use('downloads');}).then(function(d){ if(d){downloadsCap=d;render();} });
      }).catch(function(){});
    }
  }catch(e){}
})();
</script>

</body></html>
